name: Branch build and downloadable release

on:
  push:
    branches:
      - arena/22136743-age-of-epoch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build mod and publish branch release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew --no-daemon clean build

      - name: Find distributable mod jar
        id: mod-jar
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'Age-of-Epoch-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo 'No distributable Age-of-Epoch jar was produced.' >&2
            ls -la build/libs >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "Found $jar_path"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Age-of-Epoch-${{ github.sha }}
          path: ${{ steps.mod-jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Every pushed revision of the Arena branch gets its own prerelease, so older
      # builds remain downloadable and each file is tied to an exact source commit.
      - name: Publish downloadable prerelease for the Arena branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/22136743-age-of-epoch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arena-22136743-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Age of Epoch — branch build ${{ github.sha }}
          body: |
            Automatically built from branch `arena/22136743-age-of-epoch`.

            Source commit: `${{ github.sha }}`

            Download the mod JAR below and place it in your Minecraft `mods` folder.
          files: ${{ steps.mod-jar.outputs.path }}
          draft: false
          prerelease: true
          make_latest: false
