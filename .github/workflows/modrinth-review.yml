name: Complete Modrinth listing and request review

on:
  push:
    branches:
      - arena/ad7c45b3-age-of-epoch
    paths:
      - modrinth/project-metadata.json
      - modrinth/project-icon.png
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modrinth-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-and-submit:
    name: Update Modrinth project and submit for review
    if: github.ref == 'refs/heads/arena/ad7c45b3-age-of-epoch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out listing metadata and icon
        uses: actions/checkout@v7

      - name: Validate listing fields and credentials
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          [[ -n "$MODRINTH_TOKEN" ]] || { echo '::error::Missing repository secret MODRINTH_TOKEN'; exit 1; }
          [[ -n "$MODRINTH_PROJECT_ID" ]] || { echo '::error::Missing repository variable MODRINTH_PROJECT_ID'; exit 1; }
          jq -e '
            .title | type == "string" and length > 0
          ' modrinth/project-metadata.json >/dev/null
          jq -e '
            .description | type == "string" and length > 0 and length <= 250
          ' modrinth/project-metadata.json >/dev/null
          jq -e '
            .body | type == "string" and length > 0
          ' modrinth/project-metadata.json >/dev/null
          [[ -s modrinth/project-icon.png ]] || { echo '::error::Project icon is missing'; exit 1; }
          icon_size="$(wc -c < modrinth/project-icon.png)"
          (( icon_size <= 262144 )) || { echo '::error::Modrinth project icons must be at most 256 KiB'; exit 1; }
          echo "Listing metadata validated; project icon is ${icon_size} bytes."

      - name: Update latest Fabric 26.3 version dependencies
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          api='https://api.modrinth.com/v2'
          headers=(-H "Authorization: $MODRINTH_TOKEN" -H 'User-Agent: Antoniumu/Age-of-Epoch/5.0.0 (https://github.com/Antoniumu/Age-of-Epoch)')
          response="$(mktemp)"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "${headers[@]}" "$api/project/$MODRINTH_PROJECT_ID/version")"
          if [[ "$code" != 200 ]]; then
            echo "::error::Could not read Modrinth project versions (HTTP $code)."
            cat "$response"
            exit 1
          fi
          version_id="$(jq -r '[.[] | select((.loaders // []) | index("fabric")) | select((.game_versions // []) | index("26.3"))] | sort_by(.date_published) | last | .id // empty' "$response")"
          if [[ -z "$version_id" ]]; then
            echo '::error::No Fabric 26.3 version exists on this Modrinth project; cannot attach required dependencies.'
            exit 1
          fi
          jq -n \
            --arg fabricApi 'P7dR8mSH' \
            --arg trinkets 'XaT8sLP6' \
            '{dependencies:[{project_id:$fabricApi,dependency_type:"required"},{project_id:$trinkets,dependency_type:"required"}]}' \
            > modrinth/version-dependencies.json
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' -X PATCH "${headers[@]}" -H 'Content-Type: application/json' --data-binary @modrinth/version-dependencies.json "$api/version/$version_id")"
          if [[ "$code" != 204 ]]; then
            echo "::error::Could not update required dependencies on Modrinth version $version_id (HTTP $code). The token needs VERSION_WRITE permission."
            cat "$response"
            exit 1
          fi
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "${headers[@]}" "$api/version/$version_id")"
          if [[ "$code" != 200 ]] || ! jq -e '([.dependencies[]?.project_id] | index("P7dR8mSH")) != null and ([.dependencies[]?.project_id] | index("XaT8sLP6")) != null' "$response" >/dev/null; then
            echo "::error::Modrinth did not confirm both required dependencies on version $version_id."
            cat "$response"
            exit 1
          fi
          echo "Required Fabric API and Trinkets Updated dependencies confirmed on version $version_id."

      - name: Upload the provided project icon
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: Antoniumu/Age-of-Epoch/5.0.0 (https://github.com/Antoniumu/Age-of-Epoch)' \
            -H 'Content-Type: image/png' \
            --data-binary @modrinth/project-icon.png \
            "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/icon?ext=png")"
          if [[ "$code" != 204 ]]; then
            echo "::error::Modrinth icon update failed (HTTP $code). The token needs PROJECT_WRITE permission."
            cat "$response"
            exit 1
          fi
          echo 'Project icon updated.'

      - name: Fill project information and request public review
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          api='https://api.modrinth.com/v2'
          response="$(mktemp)"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: Antoniumu/Age-of-Epoch/5.0.0 (https://github.com/Antoniumu/Age-of-Epoch)' \
            "$api/tag/category")"
          if [[ "$code" != 200 ]]; then
            echo "::error::Could not validate Modrinth categories (HTTP $code)."
            cat "$response"
            exit 1
          fi
          while IFS= read -r category; do
            if ! jq -e --arg category "$category" 'any(.[]; .project_type == "mod" and .name == $category)' "$response" >/dev/null; then
              echo "::error::Modrinth does not recognize '$category' as a mod category."
              exit 1
            fi
          done < <(jq -r '.categories[]' modrinth/project-metadata.json)
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -X PATCH \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: Antoniumu/Age-of-Epoch/5.0.0 (https://github.com/Antoniumu/Age-of-Epoch)' \
            -H 'Content-Type: application/json' \
            --data-binary @modrinth/project-metadata.json \
            "$api/project/$MODRINTH_PROJECT_ID")"
          if [[ "$code" != 204 ]]; then
            echo "::error::Modrinth project update/review request failed (HTTP $code). The token needs PROJECT_WRITE permission."
            cat "$response"
            exit 1
          fi
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H 'User-Agent: Antoniumu/Age-of-Epoch/5.0.0 (https://github.com/Antoniumu/Age-of-Epoch)' \
            "$api/project/$MODRINTH_PROJECT_ID")"
          if [[ "$code" != 200 ]]; then
            echo "::error::Project was updated, but its review state could not be confirmed (HTTP $code)."
            cat "$response"
            exit 1
          fi
          if ! jq -e --slurpfile expected modrinth/project-metadata.json '
            .title == $expected[0].title and
            .description == $expected[0].description and
            .body == $expected[0].body and
            (.categories | sort) == ($expected[0].categories | sort) and
            .source_url == $expected[0].source_url and
            .issues_url == $expected[0].issues_url and
            .wiki_url == $expected[0].wiki_url and
            .license.id == $expected[0].license_id and
            .client_side == $expected[0].client_side and
            .server_side == $expected[0].server_side and
            .icon_url != null and
            .requested_status == "approved"
          ' "$response" >/dev/null; then
            echo '::error::Modrinth returned success, but the stored listing fields or review request did not match the submitted metadata.'
            cat "$response"
            exit 1
          fi
          status="$(jq -r '.status // "unknown"' "$response")"
          requested="$(jq -r '.requested_status // "none"' "$response")"
          queued="$(jq -r '.queued // "not queued"' "$response")"
          {
            echo '### Modrinth listing updated'
            echo "- Project: https://modrinth.com/project/$MODRINTH_PROJECT_ID"
            echo "- Current status: $status"
            echo "- Requested status: $requested"
            echo "- Review queue date: $queued"
            echo '- Icon, description, categories, links, license, and required version dependencies were updated.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Modrinth project status: $status; requested: $requested; queued: $queued"
