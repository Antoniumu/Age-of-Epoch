name: Publish tested airship jar
on:
  push:
    branches: [arena/7bde44a9-age-of-epoch]
    paths: ['.github/workflows/publish-airship.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the exact game-tested artifact and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exec > >(tee publish.log) 2>&1
          gh run view 40591863608 --json conclusion --jq .conclusion | grep -x success
          gh run download 40591863608 --name airship-proof --dir release-input
          jar=$(find release-input -type f -name 'Age-of-Epoch-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$jar"
          bash tools/ci/check-jar.sh "$(dirname "$jar")"
          mkdir -p release-files
          cp "$jar" release-files/Age-of-Epoch-airship-preview.jar
          sha256sum release-files/Age-of-Epoch-airship-preview.jar > release-files/SHA256SUMS.txt
          cat > release-files/NOTES.md <<'NOTES'
          # Airship hub — tested preview
          Exact binary from successful client run https://github.com/Antoniumu/Age-of-Epoch/actions/runs/40591863608 (source 34095a2).
          Minecraft 26.3, Fabric Loader 0.19.5, Java 25. Install on both client and server with Fabric API and Trinkets Updated as required by the mod.
          Use /airship summon (8 emeralds), or /airship demo as an operator. Enter the light circle below the ship. Right-click the captain to accept the introductory quest. H shows the quest giver card. /airship descend returns below the ship.
          Build and 36 tests passed; real client verified ship, lift, dialogue, acceptance click, H card, and the full introductory chain.
          This is a preview, not a finished questbook replacement. Crew are currently villager placeholders. Player skins, the Winged Sailor build, trade and voice playback are NOT included. Existing ship blocks are not protected against griefing; no claim integration. Back up your world. Restart persistence was not separately tested.
          Internal mod version remains 5.1.0; the preview filename/tag distinguishes this artifact from the older 5.1.0 release. Not marked as latest stable release.
          NOTES
          gh release create airship-preview-34095a2 release-files/Age-of-Epoch-airship-preview.jar release-files/SHA256SUMS.txt \
            --target "$(gh api repos/${{ github.repository }}/commits/34095a2 --jq .sha)" --title 'Age of Epoch — Airship hub preview' \
            --prerelease --latest=false --notes-file release-files/NOTES.md

      - name: Publish failure details
        if: failure()
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          text=Path('publish.log').read_text() if Path('publish.log').exists() else 'No publication log'
          print('::error::'+text[-6500:].replace('%','%25').replace('\n','%0A').replace('\r','%0D'))
          PYCODE
