name: Publish test build to CurseForge
run-name: CurseForge beta ${{ inputs.tag }}

# Upload the exact GitHub Release binary, never a different rebuild.
# No pull_request trigger: the upload secret is available only on a manual run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Существующий GitHub prerelease (vX.Y.Z-beta.N)'
        required: true
        default: 'v5.2.6-beta.1'
      project_id:
        description: 'Числовой Project ID; пусто — переменная CURSEFORGE_PROJECT_ID'
        required: false

permissions:
  contents: read

concurrency:
  group: curseforge-${{ inputs.project_id || vars.CURSEFORGE_PROJECT_ID }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Upload verified beta JAR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Проверить настройки, не раскрывая токен
        env:
          TAG: ${{ inputs.tag }}
          PROJECT_ID: ${{ inputs.project_id || vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CURSEFORGE_API_TOKEN" ]; then
            echo '::error::Добавьте CURSEFORGE_API_TOKEN в GitHub Actions Secrets'
            exit 1
          fi
          if [[ ! "$PROJECT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Создайте проект CurseForge и укажите числовой Project ID'
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo '::error::Этот workflow публикует только тестовые теги vX.Y.Z-beta.N'
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Скачать готовый GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isPrerelease,isDraft \
            --jq '(.isPrerelease == true) and (.isDraft == false)' | grep -x true
          gh release download "$TAG" \
            --pattern "Age-of-Epoch-${TAG#v}.jar" \
            --pattern SHA256SUMS.txt \
            --dir build/curseforge
          gh release view "$TAG" --json body --jq .body > build/curseforge/CHANGELOG.md
          expected="$(sed -nE 's/^mod_version=(.*)$/\1/p' gradle.properties | tr -d '[:space:]')"
          test "${TAG#v}" = "$expected"

      - name: Проверить SHA-256, Fabric-манифест и версию
        id: metadata
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 tools/ci/release_metadata.py "build/curseforge/Age-of-Epoch-${TAG#v}.jar" \
            --checksums build/curseforge/SHA256SUMS.txt
          bash tools/ci/check-jar.sh build/curseforge

      - name: Загрузить только игровой JAR как Beta
        # v3.3.2; pinned because this third-party action receives the upload token.
        uses: Kira-NT/mc-publish@c23376546a97f5ba7984e94445da359459b14419
        with:
          curseforge-id: ${{ inputs.project_id || vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_API_TOKEN }}
          files: build/curseforge/${{ steps.metadata.outputs.jar }}
          name: Age of Epoch ${{ steps.metadata.outputs.version }} (Fabric ${{ steps.metadata.outputs.minecraft }})
          version: ${{ steps.metadata.outputs.version }}
          version-type: beta
          changelog-file: build/curseforge/CHANGELOG.md
          loaders: fabric
          environment: client | server
          game-versions: ${{ steps.metadata.outputs.minecraft }}
          game-version-filter: none
          java: '25'
          dependencies: |
            fabric-api(required)
            trinkets-updated(required)
          fail-mode: fail

      - name: Итог загрузки
        run: |
          {
            echo '### CurseForge: тестовый JAR отправлен'
            echo 'Тип файла: Beta. Публичная доступность зависит от модерации CurseForge.'
            echo 'Загружен тот же бинарный файл, что в GitHub Release; SHA-256 проверен.'
          } >> "$GITHUB_STEP_SUMMARY"
