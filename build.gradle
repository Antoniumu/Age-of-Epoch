plugins {
    id 'java'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Loom automatically provides the Mojang and Fabric maven repositories.
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // Minecraft 26.x requires Java 25
    it.options.release = 25
    if (project.hasProperty('dshMaxErrs')) {
        it.options.compilerArgs.addAll(['-Xmaxerrs', project.property('dshMaxErrs').toString()])
    }
}

tasks.register('dshClasspath') {
    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        buildDirFile.mkdirs()
        new File(buildDirFile, 'dsh-cp.txt').text = sourceSets.main.compileClasspath.asPath
        def srcs = sourceSets.main.allJava.files.collect { '"' + it.absolutePath.replace('\\', '/') + '"' }.join('\n')
        new File(buildDirFile, 'dsh-sources.txt').text = srcs
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
