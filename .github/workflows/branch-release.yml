name: Branch build check (publishing paused)

on:
  push:
    branches:
      - arena/ad7c45b3-age-of-epoch
    paths-ignore:
      - modrinth/project-metadata.json
      - modrinth/project-icon.png
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build mod without publishing artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up build environment (Java 25 + Gradle cache)
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean build 2>&1 | tee ci-build.log

      - name: Report build failure details
        if: failure()
        shell: bash
        run: |
          if [[ -f ci-build.log ]]; then
            echo '### Gradle failure details' >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 70 ci-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '(^e: | error:|What went wrong:|Execution failed|BUILD FAILED|Caused by:)' ci-build.log | tail -n 25)
          fi
