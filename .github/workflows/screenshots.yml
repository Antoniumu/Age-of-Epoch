name: Screenshots

# Поднимает настоящий dev-клиент мода в Xvfb, проверяет экран вики и снимает
# каждую страницу каталога. PNG и манифест загружаются только как артефакт
# GitHub Actions: никакой публикации скриншотов в ветки или коммиты.
#
# Сценарии — обычные текстовые файлы в tools/e2e/scenarios/.

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Сценарии через запятую (имя файла без .txt). Пусто — берётся tools/e2e/active.txt'
        required: false
  pull_request:
  push:
    branches: [main]

concurrency:
  group: screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4G'

jobs:
  screenshots:
    name: Client screenshots (xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Не позволяем артефактам предыдущего сценария попасть в этот прогон.
      - name: Очистить прошлые снимки
        run: |
          rm -rf run/e2e/shots && mkdir -p run/e2e/shots && ls run/e2e/shots
          rm -f run/aoe-wiki-page.txt run/aoe-wiki-page.txt.tmp
          # Флаг для зонда /aoe devtest: как только игрок окажется в мире,
          # CombatProbe сам прогонит замеры DPS/лечения и удалит флаг.
          # Результаты — строки AOETEST в run/logs/latest.log и run/aoe-devtest.txt.
          mkdir -p run
          rm -f run/aoe-devtest.txt
          touch run/aoe-devtest.flag

      - uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      # mesa-vulkan-drivers обязателен: MC 26.3 (SDL3 + renderpearl) под Xvfb не
      # может создать OpenGL-контекст (нет sRGB-capable GLX visual) и должен
      # уйти в Vulkan. Lavapipe даёт программный Vulkan с VK_KHR_surface.
      - name: Пакеты для headless-клиента и снятия экрана
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            xvfb x11-utils xdotool imagemagick x11-apps openbox wmctrl \
            libgl1 libglu1-mesa libgl1-mesa-dri mesa-utils \
            mesa-vulkan-drivers vulkan-tools \
            libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1 \
            libopenal1 libpulse0 libegl1 libegl-mesa0

      - name: Клиент + сценарий + скриншоты
        id: run
        env:
          CLIENT_TIMEOUT: '1500'
          SCENARIO_INPUT: ${{ inputs.scenario }}
        run: |
          # Какой сценарий прогонять, задаётся без правки workflow:
          #   * tools/e2e/active.txt — обычный случай (правится пушем);
          #   * параметр при ручном запуске;
          #   * перечисление через запятую — каждый сценарий отдельным прогоном.
          list="$SCENARIO_INPUT"
          [ -n "$list" ] || list="$(tr -d '\n' < tools/e2e/active.txt 2>/dev/null)"
          [ -n "$list" ] || list="boot"
          echo "сценарии: $list"

          set +e
          status=0
          for name in $(echo "$list" | tr ',' ' '); do
            scenario="tools/e2e/scenarios/$name.txt"
            if [ ! -f "$scenario" ]; then
              echo "::warning::нет сценария $scenario"
              continue
            fi
            echo "=== прогон сценария $name ==="
            bash tools/e2e/run-in-xvfb.sh "$scenario" "run/e2e/shots/$name"
            [ $? -eq 0 ] || status=1
            # Скриншоты, манифест и журнал остаются в отдельном каталоге
            # сценария; артефакт сохраняет это дерево без Git-публикации PNG.
          done
          set -e

          # Боевые замеры и проверка «бесдушных основ»: строки AOETEST из лога
          # клиента. latest.log относится только к последнему сценарию, поэтому
          # дополнительно читаем aoe-devtest.txt — зонд дописывает туда же.
          # Боевые замеры диагностические: результат попадает в summary и артефакт.
          {
            grep -h "AOETEST" run/logs/latest.log 2>/dev/null || true
            cat run/aoe-devtest.txt 2>/dev/null || true
          } | awk '!seen[$0]++' > run/e2e/aoetest.log
          if [ -s run/e2e/aoetest.log ]; then
            summary=$(grep "AOETEST summary" run/e2e/aoetest.log | tail -1)
            echo "### $summary"
            grep -q "failed=0" <<< "$summary" || echo "::warning::Боевые замеры с провалами: $summary"
            # «Бесдушные основы»: важно не просто отсутствие падений, а что
            # проверка вообще дошла до живого мира (иначе клиент не вошёл в мир).
            if grep -q "AOETEST soulless " run/e2e/aoetest.log; then
              echo "Проверка бесдушных основ: $(grep -c "AOETEST soulless" run/e2e/aoetest.log) строк"
            else
              echo "::warning::Проверка бесдушных основ не выполнилась — клиент не дошёл до мира"
            fi
          fi

          shots=$(find run/e2e/shots -type f -name '*.png' | wc -l)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "shots=$shots" >> "$GITHUB_OUTPUT"
          {
            echo "### Снимки: $shots, статус: $status"
            echo '```'
            find run/e2e/shots -type f -name '*.png' -printf '%P %k КБ\n' 2>/dev/null | sort
            echo '```'
            if [ -s run/e2e/aoetest.log ]; then
              echo '#### AOETEST'
              echo '```'
              cat run/e2e/aoetest.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Артефакт со снимками и логами
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-screenshots
          path: |
            run/e2e/shots/**
            run/e2e/aoetest.log
            run/logs/latest.log
            run/e2e/gradle.log
            run/crash-reports/**
          if-no-files-found: warn
          retention-days: 14
          # PNG уже сжаты; не тратим минуты CI на повторное сжатие 371 кадров.
          compression-level: 0

      - name: Проверить скриншот каждой страницы вики
        if: always()
        env:
          SCENARIO_INPUT: ${{ inputs.scenario }}
        run: |
          list="$SCENARIO_INPUT"
          [ -n "$list" ] || list="$(tr -d '\n' < tools/e2e/active.txt 2>/dev/null)"
          wiki_selected=0
          for name in $(echo "$list" | tr ',' ' '); do
            [ "$name" = wiki ] && wiki_selected=1
          done
          if [ "$wiki_selected" -eq 1 ]; then
            [ -d run/e2e/shots/wiki ] || { echo "::error::Сценарий wiki не создал каталог скриншотов"; exit 1; }
            python3 tools/e2e/verify_wiki_screenshots.py run/e2e/shots/wiki
          else
            echo "Сценарий wiki не входил в этот прогон; проверка покрытия скриншотами пропущена."
          fi

      # Регрессия экипировки также валит job; боевые замеры остаются диагностическими.
      - name: Фикс макс. HP от экипировки (gear-зонд)
        if: always()
        run: |
          if [ -f run/e2e/aoetest-gear-failed ]; then
            echo "::error::Зонд экипировки провалился: макс. HP не обновляется от брони — см. AOETEST в job summary и артефакте client-screenshots"
            exit 1
          fi
          echo "Проверки экипировки/макс. HP прошли."
