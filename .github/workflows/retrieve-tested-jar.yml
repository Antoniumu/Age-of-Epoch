name: Retrieve tested game jar
on:
  push:
    branches: [arena/7bde44a9-age-of-epoch]
    paths: ['.github/workflows/retrieve-tested-jar.yml']
permissions:
  actions: read
  contents: write
jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the exact successful client run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 40763446760 --json conclusion,headSha,headBranch --jq '.conclusion + " " + .headSha + " " + .headBranch' | grep -Fx 'success b37bd213ff24e4b52a692da15c146b676c77d518 arena/7bde44a9-age-of-epoch'
      - uses: actions/download-artifact@v5
        with:
          name: airship-proof
          run-id: '40763446760'
          github-token: ${{ github.token }}
          path: recovered
      - name: Check and temporarily transfer tested jar
        run: |
          set -euo pipefail
          jar=$(find recovered -type f -name 'Age-of-Epoch-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)
          test -n "$jar"
          bash tools/ci/check-jar.sh "$(dirname "$jar")"
          mkdir -p deliverables
          cp "$jar" deliverables/Age-of-Epoch-tested-b37bd21.jar
          sha256sum deliverables/Age-of-Epoch-tested-b37bd21.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin arena/7bde44a9-age-of-epoch
          git add -f deliverables/Age-of-Epoch-tested-b37bd21.jar
          git commit -m 'Transfer tested jar temporarily [skip ci]'
          git push origin HEAD:arena/7bde44a9-age-of-epoch
