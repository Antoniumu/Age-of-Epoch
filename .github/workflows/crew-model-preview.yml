name: Render crew on real 3D models
on:
  push:
    branches: [arena/7bde44a9-age-of-epoch]
    paths: ['docs/airship/crew-preview/**', 'tools/airship/crew-preview/**', '.github/workflows/crew-model-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crew-model-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci
        working-directory: tools/airship/crew-preview
      - run: npx playwright-core install --with-deps chromium
        working-directory: tools/airship/crew-preview
      - run: npm run build && npm test
        working-directory: tools/airship/crew-preview
      - uses: actions/upload-artifact@v7
        with:
          name: crew-model-proof
          path: docs/airship/crew-preview/*proof.png
      - name: Preserve actual browser renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/airship/crew-preview
          if ! git diff --cached --quiet; then
            git commit -m 'Record actual eight-model browser renders [skip ci]'
            git pull --rebase origin arena/7bde44a9-age-of-epoch
            git push origin HEAD:arena/7bde44a9-age-of-epoch
          fi
