name: Branch build and downloadable release

on:
  push:
    branches:
      - arena/22136743-age-of-epoch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: branch-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build mod and publish branch release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up build environment (Java 25 + Gradle cache)
        uses: ./.github/actions/setup-build-env
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}

      - name: Build mod
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace clean build 2>&1 | tee ci-build.log

      - name: Report build failure details
        if: failure()
        shell: bash
        run: |
          summary="$GITHUB_STEP_SUMMARY"
          if [[ -f ci-build.log ]]; then
            {
              echo '### Gradle failure details'
              echo '```text'
              tail -n 70 ci-build.log
              echo '```'
            } >> "$summary"
            while IFS= read -r line; do
              echo "::error::$line"
            done < <(grep -E '(^e: | error:|What went wrong:|Execution failed|BUILD FAILED|Caused by:)' ci-build.log | tail -n 25)
          fi

          # Имена упавших тестов и причину берём из XML-отчётов: в логе Gradle
          # видно только «There were failing tests», а какая проверка и почему
          # упала — нет. Строки из пайтона идут сразу в annotations и в summary.
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          failed = []
          for path in sorted(glob.glob('build/test-results/test/TEST-*.xml')):
              try:
                  root = ET.parse(path).getroot()
              except Exception:
                  continue
              for case in root.iter('testcase'):
                  for kind in ('failure', 'error'):
                      node = case.find(kind)
                      if node is None:
                          continue
                      raw = (node.get('message') or node.text or '').strip()
                      first = raw.splitlines()[0][:400] if raw else 'без сообщения'
                      failed.append('%s.%s: %s' % (case.get('classname'), case.get('name'), first))

          if failed:
              out = ['### Упавшие тесты (%d)' % len(failed), '```text'] + failed + ['```', '']
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as handle:
                      handle.write('\n'.join(out) + '\n')
              for line in failed:
                  print('::error::' + line)
          PY

      - name: Keep Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.sha }}
          path: ci-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Find distributable mod jar
        id: mod-jar
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'Age-of-Epoch-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo 'No distributable Age-of-Epoch jar was produced.' >&2
            ls -la build/libs >&2 || true
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"
          echo "Found $jar_path"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Age-of-Epoch-${{ github.sha }}
          path: ${{ steps.mod-jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Each pushed revision has its own prerelease, tied to an exact source commit.
      - name: Publish downloadable prerelease for the Arena branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/22136743-age-of-epoch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: arena-22136743-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Age of Epoch — branch build ${{ github.sha }}
          body: |
            Automatically built from branch `arena/22136743-age-of-epoch`.

            Source commit: `${{ github.sha }}`

            Download the mod JAR below and place it in your Minecraft `mods` folder.
          files: ${{ steps.mod-jar.outputs.path }}
          draft: false
          prerelease: true
          make_latest: false
