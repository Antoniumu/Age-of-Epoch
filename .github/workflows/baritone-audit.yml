name: Baritone player route experiment
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: baritone-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build-env
      - name: Compile and unit tests
        run: ./gradlew build
      - name: Prepare temporary Baritone client and safety settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p run/mods run/baritone
          gh release download v1.20.0 --repo cabaletta/baritone --pattern baritone-standalone-fabric-1.20.0.jar --dir run/mods
          echo '63d78d9f6cd2e66983b5b4e0d6c79f5c52a9d3321b0fcd2117f5856ce7276dc7  run/mods/baritone-standalone-fabric-1.20.0.jar' | sha256sum -c -
          cat > run/baritone/settings.txt <<'SETTINGS'
          allowBreak false
          allowPlace false
          allowSprint false
          allowParkour false
          allowWaterBucketFall false
          allowInventory false
          maxFallHeightNoWater 0
          SETTINGS
      - name: Headless graphics
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends xvfb x11-utils xdotool imagemagick x11-apps openbox wmctrl libgl1 libglu1-mesa libgl1-mesa-dri mesa-utils mesa-vulkan-drivers vulkan-tools libxi6 libxcursor1 libxrandr2 libxinerama1 libxxf86vm1 libopenal1 libpulse0 libegl1 libegl-mesa0
      - name: Actual player route experiment
        env:
          RENDER_DISTANCE: 10
          E2E_FAIL_FAST: 1
        run: |
          bash tools/e2e/run-in-xvfb.sh tools/e2e/scenarios/baritone-routes.txt run/e2e/baritone
          ! grep -q 'AIRSHIPTEST FAIL' run/logs/latest.log
          grep -q 'AIRSHIPROUTE BARITONE safety_verified=true' run/logs/latest.log
          for npc in captain mara quartermaster oren veya selin lysander tik; do
            grep -q "AIRSHIPROUTE RESULT npc=$npc " run/logs/latest.log
          done
      - name: Publish diagnostic log without claiming reachability
        if: always() && !cancelled() && github.ref == 'refs/heads/arena/7bde44a9-age-of-epoch'
        run: |
          set -euo pipefail
          git pull --rebase --autostash origin arena/7bde44a9-age-of-epoch
          {
            echo "Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Source: ${{ github.sha }}"
            echo 'Experiment only: one candidate per NPC, 35-second budget, no proof of actual click or globally optimal route.'
            grep -E 'AIRSHIPROUTE|AIRSHIPTEST (PASS|FAIL|WINGED diagnostic)' run/logs/latest.log 2>/dev/null || true
            echo '--- runner tail ---'
            tail -60 run/e2e/gradle.log 2>/dev/null || true
          } > docs/airship/baritone-proof.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/airship/baritone-proof.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record Baritone route experiment [skip ci]'
            git push origin HEAD:arena/7bde44a9-age-of-epoch
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baritone-route-experiment
          path: |
            run/e2e/baritone/
            run/logs/
            run/e2e/gradle.log
            run/baritone/settings.txt
