name: Release

# Собирает мод и создаёт GitHub Release, когда в репозиторий пушат тег вида v5.0.0.
#   git tag v5.0.0 && git push origin v5.0.0
#
# Тег обязан совпадать с mod_version в gradle.properties — иначе job упадёт,
# чтобы релиз не разошёлся с версией внутри jar.

on:
  push:
    tags: ['v*']
    branches: ['arena/c35f20b1-age-of-epoch']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег, который релизим (например v5.0.0)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4G'

jobs:
  release:
    if: (github.event_name != 'workflow_dispatch' || inputs.tag != 'build-3af2be7') && github.ref != 'refs/heads/arena/c35f20b1-age-of-epoch'
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env

      - name: Тег совпадает с mod_version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          mod_version="$(sed -nE 's/^mod_version=(.*)$/\1/p' gradle.properties | tr -d '[:space:]')"
          echo "тег: $tag_version, mod_version: $mod_version"
          if [ "$tag_version" != "$mod_version" ]; then
            echo "::error::Тег $TAG не совпадает с mod_version=$mod_version в gradle.properties"
            exit 1
          fi

      - name: ./gradlew build
        run: ./gradlew build --stacktrace --no-problems-report

      - name: Проверить содержимое jar
        run: bash tools/ci/check-jar.sh build/libs

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Файлы: основной jar и jar с исходниками (sources удобно класть в IDE).
          # dev-jar для запуска из IDE игроку не нужен и только путает при
          # скачивании, поэтому в релиз он не попадает.
          shopt -s nullglob
          files=()
          for jar in build/libs/*.jar; do
            case "$jar" in
              *-dev.jar) continue ;;
            esac
            files+=("$jar")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo '::error::В build/libs нет ни одного jar для релиза'
            exit 1
          fi
          printf 'В релиз пойдёт:\n'
          printf '  %s\n' "${files[@]}"

          gh release create "$TAG" "${files[@]}" \
            --title "Age of Epoch $TAG" \
            --generate-notes \
            --verify-tag

  publish-verified-main-build:
    if: (github.event_name == 'workflow_dispatch' && inputs.tag == 'build-3af2be7') || (github.event_name == 'push' && github.ref == 'refs/heads/arena/c35f20b1-age-of-epoch')
    name: Publish verified main build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify the successful main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=40885757474
          repo="${{ github.repository }}"
          test "$(gh run view "$run" --repo "$repo" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$run" --repo "$repo" --json headSha --jq .headSha)" = 3af2be78270a173bf1bd5d9e206ddb9c3803244a
          mkdir artifacts
          gh run download "$run" --repo "$repo" --name Age-of-Epoch-jar --dir artifacts
          python3 - <<'PYVERIFY'
          import glob, hashlib, json, os, zipfile
          jars = [p for p in glob.glob('artifacts/*.jar') if not p.endswith('-sources.jar')]
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as jar:
              assert jar.testzip() is None
              mod = json.loads(jar.read('fabric.mod.json'))
              assert mod['id'] == 'mmorpg' and mod['version'] == '5.1.0', mod
              assert 'com/robertx22/age_of_exile/gamemaster/WorldStorage.class' in jar.namelist()
          for path in glob.glob('artifacts/*.jar'):
              print(os.path.basename(path), hashlib.sha256(open(path, 'rb').read()).hexdigest())
          PYVERIFY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create build-3af2be7 artifacts/*.jar \
            --repo "${{ github.repository }}" \
            --target 3af2be78270a173bf1bd5d9e206ddb9c3803244a \
            --title 'Age of Epoch — сборка main 3af2be7' \
            --latest \
            --notes 'Проверенная сборка актуального main (коммит 3af2be7), включая хранение телеметрии и данных GameMaster в папке мира. Внутренняя версия мода: 5.1.0. JAR и исходники собраны и проверены GitHub Actions: https://github.com/Antoniumu/Age-of-Epoch/actions/runs/40885757474'
