name: Compile check
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ce79d9a7ba547cf74dc926e7a677d7eb8942990e
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile and package without tests
        run: ./gradlew jar sourcesJar --stacktrace --no-problems-report
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create build-ce79d9a build/libs/Age-of-Epoch-5.1.0.jar build/libs/Age-of-Epoch-5.1.0-sources.jar \
            --target ce79d9a7ba547cf74dc926e7a677d7eb8942990e \
            --title 'Age of Epoch — сборка main ce79d9a' \
            --notes 'Сборка main (ce79d9a), внутренняя версия мода 5.1.0. Скомпилировано без запуска тестов и дополнительных проверок.'
