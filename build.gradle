plugins {
    id 'java'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    // Loom automatically provides the Mojang and Fabric maven repositories.
    maven { url = 'https://maven.nucleoid.xyz/releases' }
    maven { url = 'https://maven.gnomecraft.net/releases' }
    maven { url = 'https://maven.architectury.dev' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Trinkets Updated (replaces Curios for trinket/accessory slots)
    implementation "eu.pb4:trinkets:4.2.1+26.3"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    // Minecraft 26.x requires Java 25
    it.options.release = 25
    if (project.hasProperty('dshMaxErrs')) {
        it.options.compilerArgs.addAll(['-Xmaxerrs', project.property('dshMaxErrs').toString()])
    }
}

// ---------------------------------------------------------------------------
//  Проверка, что Minecraft вообще попал в compileClasspath.
//
//  Типовой отказ выглядит так: сотня ошибок "package net.minecraft.* does not
//  exist" и в конце NullPointerException из аннотационного процессора Mixin
//  (он падает как раз на отсутствующих классах Minecraft). Настоящая причина —
//  пустой или битый артефакт Minecraft в кэше Loom, а не ошибки в коде.
//  Эта задача падает первой и говорит, что делать.
// ---------------------------------------------------------------------------
def dshHasMinecraftClasses = { File file ->
    if (file == null) {
        return false
    }
    // каталог с распакованными классами (Loom так тоже умеет)
    if (file.isDirectory()) {
        def classes = new File(file, 'net/minecraft')
        return classes.isDirectory() && classes.list() != null && classes.list().length > 0
    }
    if (!file.isFile() || !file.name.toLowerCase().endsWith('.jar')) {
        return false
    }
    def zip = null
    try {
        zip = new java.util.zip.ZipFile(file)
        def entries = zip.entries()
        int seen = 0
        while (entries.hasMoreElements() && seen < 40000) {
            if (entries.nextElement().name.startsWith('net/minecraft/')) {
                return true
            }
            seen++
        }
        return false
    } catch (Exception ignored) {
        return false
    } finally {
        if (zip != null) {
            try { zip.close() } catch (Exception ignored) { }
        }
    }
}

tasks.register('dshMcCheck') {
    group = 'verification'
    description = 'Проверяет, что jar-ы Minecraft с классами net/minecraft есть в compileClasspath.'
    notCompatibleWithConfigurationCache('резолвит compileClasspath во время выполнения')
    doLast {
        def jars
        try {
            jars = configurations.compileClasspath.files.findAll { it.name.toLowerCase().endsWith('.jar') || it.isDirectory() }
        } catch (Exception e) {
            logger.warn("dshMcCheck: не удалось получить compileClasspath: ${e.message}")
            return
        }
        def mcJars = jars.findAll { dshHasMinecraftClasses(it) }
        if (mcJars.isEmpty()) {
            def candidates = jars.findAll {
                def n = it.name.toLowerCase()
                n.contains('minecraft') || n.contains('loom') || n.contains('intermediary')
            }
            def list = candidates.isEmpty()
                ? 'в classpath нет ни одного артефакта с "minecraft" в имени'
                : 'найдены артефакты без классов Minecraft: ' + candidates.collect { it.name }.join(', ')
            throw new GradleException(
                "Minecraft не попал в compileClasspath (${list}).\n" +
                "Обычно это недокачанный или битый кэш Loom. Закройте игру и выполните:\n" +
                "    build.bat cleanloom\n" +
                "    (вручную: rmdir /s /q .gradle-home\\caches\\fabric-loom, затем build --refresh-dependencies)\\n" +
                "Если не помогло — запустите build.bat dshClasspath и посмотрите build/dsh-cp.txt,\n" +
                "есть ли там minecraft-*.jar и сколько он весит (нормальный — десятки МБ)."
            )
        }
        logger.lifecycle("dshMcCheck: классы Minecraft найдены в " + mcJars.collect { it.name }.join(', '))
    }
}

tasks.named('compileJava').configure {
    dependsOn 'dshMcCheck'
}

tasks.register('dshClasspath') {
    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        buildDirFile.mkdirs()
        new File(buildDirFile, 'dsh-cp.txt').text = sourceSets.main.compileClasspath.asPath
        def srcs = sourceSets.main.allJava.files.collect { '"' + it.absolutePath.replace('\\', '/') + '"' }.join('\n')
        new File(buildDirFile, 'dsh-sources.txt').text = srcs
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
